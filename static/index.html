<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ScoreOCR Toolkit - SheetMusicOMR v3.00</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--card:#334155;--border:#475569;--accent:#38bdf8;--accent2:#10b981;--accent3:#f97316;--text:#f8fafc;--muted:#94a3b8;--dim:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:1rem;font-weight:700;color:#fff}
.badge{font-size:.7rem;background:#1d4ed8;color:#fff;padding:1px 7px;border-radius:99px;font-weight:600}
.badge.g{background:#065f46}
.sp{flex:1}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:5px 12px;border-radius:5px;font-size:.82rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn:hover{background:#475569}
.btn.p{background:var(--accent);border-color:var(--accent);color:#0f172a;font-weight:600}
.btn.s{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.d{background:var(--accent3);border-color:var(--accent3);color:#fff}
.btn.a{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:600}
input[type=file]{display:none}
.toolbar{position:absolute;top:10px;left:10px;background:rgba(30,41,59,.92);border:1px solid var(--border);padding:4px 6px;border-radius:8px;display:flex;gap:4px;z-index:5}
.sep{width:1px;background:var(--border);margin:0 3px}
.main{display:flex;flex:1;overflow:hidden}
.canvas-area{flex:1;position:relative;overflow:hidden;background:#090d16;min-width:0}
.cw{width:100%;height:100%;overflow:auto;position:relative;cursor:default}
.cw.pan{cursor:grab}.cw.add{cursor:crosshair}
canvas{display:block;transform-origin:0 0}
.loader{position:absolute;inset:0;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:20}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sidebar{width:340px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel{border-bottom:1px solid var(--border);padding:12px}
.pt{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pt .v{color:var(--accent);font-size:.8rem;text-transform:none;font-weight:500}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:3px}
.ctrl{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-size:.85rem}
.ctrl:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.g7 button,.g3 button{padding:6px 0;text-align:center;font-weight:600;font-size:.85rem}
.sl{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;background:var(--card)}
.si{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem;display:flex;justify-content:space-between;cursor:pointer}
.si:hover{background:#475569}.si.sel{background:rgba(56,189,248,.18);border-left:3px solid var(--accent)}
.jp{background:#042f2e;border:1px solid #065f46;color:#6ee7b7;font-family:Consolas,monospace;font-size:.82rem;line-height:1.45;padding:8px;border-radius:5px;white-space:pre-wrap;resize:none;min-height:80px}
.hint{font-size:.72rem;color:var(--dim);margin-top:6px;line-height:1.4}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.tab{padding:8px 14px;cursor:pointer;font-size:.82rem;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}.tab.act{color:var(--accent);border-bottom-color:var(--accent)}
.tb{display:none;flex:1;overflow-y:auto}
.tb.act{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><h1>&#x1F3BC; ScoreOCR Toolkit</h1><span class="badge">v3.00</span><span class="badge g">SheetMusicOMR</span></div>
  <span class="sp"></span>
  <a href="/" class="btn" style="text-decoration:none;color:#fff;background:#3b82f6;border-color:#2563eb;" title="切換至 SheetMusicOMR 視覺工作台">🏠 工作台</a>
  <a href="/editor/studio/default" class="btn" style="text-decoration:none;color:#fff;background:#8b5cf6;border-color:#7c3aed;" title="切換至 Score Studio 專業製譜編輯器">🎼 Score Studio</a>
  <input type="file" id="fi" accept=".png,.jpg,.jpeg,.bmp,.webp,.tiff,.pdf,.docx,.txt,.json,image/*">
  <button class="btn" onclick="document.getElementById('fi').click()">&#x1F4C1; 上傳檔案</button>
  <button class="btn" onclick="loadSample()">&#x1F3BC; 示範</button>
  <button class="btn p" id="bRec" onclick="runRecognize()">&#x26A1; 辨識轉換</button>
  <button class="btn s" id="bXml" style="display:none" onclick="dlXml()">&#x1F4E5; MusicXML</button>
  <button class="btn s" id="bJp" style="display:none;background:#0d9488;border-color:#14b8a6" onclick="dlJp()">&#x1F3BC; 簡譜</button>
</div>
<div class="main">
  <div class="canvas-area" id="ca">
    <div class="toolbar">
      <button class="btn a" id="tSel" onclick="setTool('select')">&#x1F446; 選取</button>
      <button class="btn" id="tAdd" onclick="setTool('add')">&#x2795; 新增</button>
      <button class="btn" id="tPan" onclick="setTool('pan')">&#x1F590; 拖曳</button>
      <div class="sep"></div>
      <button class="btn a" id="tJp" onclick="togJp()">&#x1F3BC; 簡譜標記 ON</button>
      <div class="sep"></div>
      <button class="btn" onclick="zBy(0.15)">+&#x1F50D;</button>
      <button class="btn" onclick="zBy(-0.15)">-&#x1F50D;</button>
      <button class="btn" onclick="zReset()">1:1</button>
      <div class="sep"></div>
      <span id="zLab" style="font-size:.78rem;color:var(--muted);align-self:center">100%</span>
    </div>
    <div class="cw" id="cw"><canvas id="cv"></canvas></div>
    <div class="loader" id="ld"><div class="spinner"></div><span id="ldTxt">處理中...</span></div>
  </div>
  <div class="sidebar">
    <div class="tabs">
      <div class="tab act" onclick="swTab('e')">&#x1F39B; 編輯器</div>
      <div class="tab" onclick="swTab('j')">&#x1F3BC; 簡譜</div>
      <div class="tab" onclick="swTab('s')">&#x1F4CB; 符號</div>
      <div class="tab" onclick="swTab('p')">&#x1F4BE; 專案</div>
    </div>
    <!-- Editor tab -->
    <div class="tb act" id="tb-e">
      <div class="panel">
        <div class="pt">音符校對 <span class="v" id="sId">未選取</span></div>
        <div class="fg">
          <label>音高</label>
          <div class="g7">
            <button class="btn" onclick="sBase('C')">C</button><button class="btn" onclick="sBase('D')">D</button><button class="btn" onclick="sBase('E')">E</button><button class="btn" onclick="sBase('F')">F</button><button class="btn" onclick="sBase('G')">G</button><button class="btn" onclick="sBase('A')">A</button><button class="btn" onclick="sBase('B')">B</button>
          </div>
          <div class="g3">
            <button class="btn" id="a0" onclick="sAcc('')">本位</button><button class="btn" id="a1" onclick="sAcc('#')">升</button><button class="btn" id="a2" onclick="sAcc('b')">降</button>
          </div>
          <div class="row">
            <select class="ctrl" id="oct" onchange="uPitch()">
              <option value="2">八度 2</option><option value="3">八度 3</option><option value="4" selected>八度 4</option><option value="5">八度 5</option><option value="6">八度 6</option>
            </select>
            <input class="ctrl" id="pIn" placeholder="例如 C#4" onchange="pManual()">
          </div>
        </div>
        <div class="fg"><label>時值</label><select class="ctrl" id="dur" onchange="fc('duration',this.value)"><option value="whole">全</option><option value="half">二分</option><option value="quarter" selected>四分</option><option value="eighth">八分</option><option value="16th">十六</option><option value="32nd">三十二</option></select></div>
        <div class="fg"><label>類型</label><select class="ctrl" id="typ" onchange="fc('type',this.value)"><option value="note">音符</option><option value="rest">休止符</option><option value="chord">和弦</option><option value="clef">譜號</option><option value="barline">小節線</option></select></div>
        <div class="fg"><label>座標 X Y W H</label>
          <div class="r3"><input class="ctrl" id="cx" type="number" placeholder="X" onchange="cc('x',this.value)"><input class="ctrl" id="cy" type="number" placeholder="Y" onchange="cc('y',this.value)"><input class="ctrl" id="cW" type="number" placeholder="W" onchange="cc('width',this.value)"></div>
          <div class="row" style="margin-top:4px"><input class="ctrl" id="cH" type="number" placeholder="H" onchange="cc('height',this.value)"><button class="btn d" style="flex:1" onclick="delSym()">刪除</button></div>
        </div>
        <p class="hint">&#x1F79C; 箭頭鍵微調（Shift 快速），Delete 刪除，拖曳右下調整大小。</p>
      </div>
    </div>
    <!-- Jianpu tab -->
    <div class="tb" id="tb-j">
      <div class="panel">
        <div class="pt">簡譜預覽</div>
        <div class="row" style="margin-bottom:8px">
          <div class="fg"><label>調號</label><select class="ctrl" id="jk" onchange="rJp()"><option value="C" selected>1=C</option><option value="G">1=G</option><option value="D">1=D</option><option value="A">1=A</option><option value="F">1=F</option><option value="Bb">1=Bb</option></select></div>
          <div class="fg"><label>拍號</label><select class="ctrl" id="jm" onchange="rJp()"><option value="4/4" selected>4/4</option><option value="3/4">3/4</option><option value="2/4">2/4</option><option value="6/8">6/8</option></select></div>
        </div>
        <div class="fg"><textarea class="jp" id="jpArea" rows="8" readonly></textarea></div>
        <div style="display:flex;gap:6px">
          <button class="btn" style="flex:1" onclick="cpyJp()">複製</button>
          <button class="btn s" style="flex:1;background:#0d9488;border-color:#14b8a6" onclick="dlJp()">下載簡譜</button>
        </div>
      </div>
    </div>
    <!-- Symbols tab -->
    <div class="tb" id="tb-s">
      <div class="panel" style="flex:1;display:flex;flex-direction:column">
        <div class="pt">符號清單 <span class="badge" id="sc">0</span></div>
        <div class="sl" id="sList"></div>
        <p class="hint">點擊選擇；在編輯器 tab 修改屬性。</p>
      </div>
    </div>
    <!-- Project tab -->
    <div class="tb" id="tb-p">
      <div class="panel">
        <div class="pt">專案管理</div>
        <div class="fg"><label>專案名稱</label><input class="ctrl" id="pName" placeholder="我的樂譜" value=""></div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <button class="btn p" onclick="saveProj()">儲存專案</button>
          <button class="btn" onclick="document.getElementById('pLoad').click()">載入專案 (JSON)</button>
          <input type="file" id="pLoad" accept=".json" onchange="loadProj(event)">
        </div>
        <p class="hint">專案包含符號、設定、背景影像。</p>
      </div>
      <div class="panel">
        <div class="pt">匯出</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="btn s" onclick="expXml()">匯出 MusicXML</button>
          <button class="btn s" style="background:#0d9488;border-color:#14b8a6" onclick="expJp()">匯出簡譜</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const API='';
let syms=[],sel=null,img=null,curBase='C',curAcc='';
let tool='select',zoom=1,jpOn=true;
let jpUrl=null,xmUrl=null,cFile=null;
let isPan=false,isDr=false,dMode=null,pSX=0,pSY=0,sSX=0,sSY=0,dOX=0,dOY=0;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cw=document.getElementById('cw');

window.onload=()=>loadSample();

function setTool(t){
  tool=t;
  ['tSel','tAdd','tPan'].forEach((id,i)=>{
    const b=document.getElementById(id);
    b.classList.toggle('a',['select','add','pan'][i]===t);
  });
  cw.className='cw';
  if(t==='pan')cw.classList.add('pan');
  if(t==='add')cw.classList.add('add');
}
function togJp(){
  jpOn=!jpOn;
  const b=document.getElementById('tJp');
  b.classList.toggle('a',jpOn);
  b.textContent='&#x1F3BC; 簡譜標記 '+(jpOn?'ON':'OFF');
  redraw();
}
function zBy(d){zoom=Math.max(.3,Math.min(3,zoom+d));apZ();}
function zReset(){zoom=1;apZ();}
function apZ(){cv.style.transform='scale('+zoom+')';document.getElementById('zLab').textContent=Math.round(zoom*100)+'%';}
function showL(m){document.getElementById('ldTxt').textContent=m||'處理中...';document.getElementById('ld').style.display='flex';}
function hideL(){document.getElementById('ld').style.display='none';}
function setImg(src){const i=new Image();i.onload=()=>{cv.width=i.width;cv.height=i.height;redraw();};i.src=src;}

async function loadSample(){
  showL('載入示範...');
  try{
    const r=await fetch(API+'/api/sample');
    const d=await r.json();
    setImg(d.image_url);
    syms=d.symbols||[];
    xmUrl=d.musicxml||null;
    document.getElementById('bXml').style.display=xmUrl?'':'none';
    if(d.jianpu_text)document.getElementById('jpArea').value=d.jianpu_text;
    sel=syms[0]||null;
    refAll();
  }catch(e){console.error(e);}
  hideL();
}

document.getElementById('fi').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;cFile=f;
  const ext=f.name.split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','bmp','webp','tiff'].includes(ext)){
    const r=new FileReader();
    r.onload=ev=>{setImg(ev.target.result);syms=[];sel=null;refAll();};
    r.readAsDataURL(f);
  }else{runRecognize();}
  e.target.value='';
});

async function runRecognize(){
  if(!cFile&&!cv.width){alert('請先上傳檔案或載入示範！');return;}
  showL('正在辨識...');
  try{
    let fd=new FormData();
    if(cFile)fd.append('file',cFile);
    else{const b=await new Promise(r=>cv.toBlob(r,'image/png'));fd.append('file',b,'score.png');}
    const r=await fetch(API+'/recognize',{method:'POST',body:fd});
    const d=await r.json();
    if(d.success!==false){
      syms=d.symbols||[];cFile=null;setImg(d.image_url);
      xmUrl=d.xml_name?API+'/download/'+d.xml_name:null;
      jpUrl=d.jianpu_name?API+'/download/'+d.jianpu_name:null;
      document.getElementById('bXml').style.display=xmUrl?'':'none';
      document.getElementById('bJp').style.display=jpUrl?'':'none';
      if(d.jianpu_text)document.getElementById('jpArea').value=d.jianpu_text;
      sel=syms[0]||null;refAll();
    }else{
      showModal(d.error_type||'錯誤',d.error||''+(d.suggestion?'\n\n'+d.suggestion:''));
      if(d.image_url){setImg(d.image_url);syms=[];sel=null;refAll();}
    }
  }catch(err){alert('連線錯誤: '+err);}
  finally{hideL();}
}

// Mouse
cv.addEventListener('mousedown',e=>{
  if(tool==='pan'){isPan=true;pSX=e.clientX;pSY=e.clientY;sSX=cw.scrollLeft;sSY=cw.scrollTop;return;}
  const c=gC(e);
  if(tool==='add'){
    const s={id:'sym-'+Date.now().toString(36),type:'note',pitch:'C4',duration:'quarter',x:Math.round(c.x-9),y:Math.round(c.y-8),width:18,height:16,confidence:1};
    syms.push(s);sel=s;refAll();return;
  }
  let hit=null,mode='move';
  for(let i=syms.length-1;i>=0;i--){
    const s=syms[i];
    if(c.x>=s.x&&c.x<=s.x+s.width&&c.y>=s.y&&c.y<=s.y+s.height){
      hit=s;if(c.x>=s.x+s.width-8&&c.y>=s.y+s.height-8)mode='resize';break;
    }
  }
  sel=hit;if(hit){isDr=true;dMode=mode;dOX=c.x-hit.x;dOY=c.y-hit.y;}
  refAll();redraw();
});
window.addEventListener('mousemove',e=>{
  if(isPan){cw.scrollLeft=sSX-(e.clientX-pSX);cw.scrollTop=sSY-(e.clientY-pSY);return;}
  if(isDr&&sel){
    const c=gC(e);
    if(dMode==='move'){sel.x=Math.round(c.x-dOX);sel.y=Math.round(c.y-dOY);}
    else{sel.width=Math.max(6,Math.round(c.x-sel.x));sel.height=Math.max(6,Math.round(c.y-sel.y));}
    refSB();redraw();
  }
});
window.addEventListener('mouseup',()=>{isPan=false;isDr=false;});
window.addEventListener('keydown',e=>{
  if(!sel)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Delete'||e.key==='Backspace'){delSym();}
  else if(e.key==='ArrowLeft'){sel.x-=e.shiftKey?5:1;refSB();redraw();}
  else if(e.key==='ArrowRight'){sel.x+=e.shiftKey?5:1;refSB();redraw();}
  else if(e.key==='ArrowUp'){sel.y-=e.shiftKey?5:1;refSB();redraw();}
  else if(e.key==='ArrowDown'){sel.y+=e.shiftKey?5:1;refSB();redraw();}
});

function gC(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};}

// Draw
function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const k=document.getElementById('jk').value;
  syms.forEach(s=>{
    const sl=sel&&sel.id===s.id;
    ctx.lineWidth=sl?2.5:1.5;
    if(sl){ctx.strokeStyle='#facc15';ctx.fillStyle='rgba(250,204,21,.22)';}
    else if(s.type==='rest'){ctx.strokeStyle='#f97316';ctx.fillStyle='rgba(249,115,22,.13)';}
    else if(s.type==='chord'){ctx.strokeStyle='#a855f7';ctx.fillStyle='rgba(168,85,247,.13)';}
    else{ctx.strokeStyle='#06b6d4';ctx.fillStyle='rgba(6,182,212,.13)';}
    ctx.fillRect(s.x,s.y,s.width,s.height);ctx.strokeRect(s.x,s.y,s.width,s.height);
    const lb=s.pitch||s.type;
    if(lb){ctx.font='bold 11px sans-serif';ctx.fillStyle=sl?'#facc15':'#fff';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=4;ctx.fillText(lb,s.x,s.y-4);ctx.shadowBlur=0;}
    if(jpOn&&(s.type==='note'||s.type==='chord')){const j=p2j(s.pitch,k);if(j)dBadge(ctx,s.x+s.width/2,s.y+s.height+14,j,sl);}
    else if(jpOn&&s.type==='rest'){dBadge(ctx,s.x+s.width/2,s.y+s.height+14,'0',sl);}
    if(sl){ctx.fillStyle='#facc15';ctx.fillRect(s.x+s.width-5,s.y+s.height-5,5,5);}
  });
}

function dBadge(ct,cx,cy,txt,sl){
  ct.font='bold 10px Consolas,monospace';
  const w=ct.measureText(txt).width+8,h=14,x=cx-w/2,y=cy;
  ct.fillStyle=sl?'#854d0e':'#064e3b';ct.strokeStyle=sl?'#fde047':'#34d399';ct.lineWidth=1;
  ct.fillRect(x,y,w,h);ct.strokeRect(x,y,w,h);
  ct.fillStyle=sl?'#fef08a':'#ecfdf5';ct.textAlign='center';ct.textBaseline='middle';
  ct.fillText(txt,x+w/2,y+h/2);ct.textAlign='left';ct.textBaseline='alphabetic';
}

function p2j(p,k){
  if(!p)return'';
  const m=p.match(/^([A-G])([#b]?)([0-9]?)$/);if(!m)return'';
  const[_,step,acc,os]=m;
  const ns=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],en={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  let n=step+acc;if(en[n])n=en[n];const kn=en[k]||k;
  const ni=ns.indexOf(n),ki=ns.indexOf(kn);if(ni<0||ki<0)return n;
  const sm=(ni-ki+12)%12;
  const mp={0:'1',1:'#1',2:'2',3:'#2',4:'3',5:'4',6:'#4',7:'5',8:'#5',9:'6',10:'b7',11:'7'};
  let j=mp[sm]||'?';
  const o=os?parseInt(os):4;
  if(o>=5)j+='\u0307';else if(o<=3)j+='\u0323';
  return j;
}

// Sidebar refresh
function refAll(){refSB();refJP();refSL();redraw();}
function refSB(){
  if(!sel){document.getElementById('sId').textContent='未選取';document.getElementById('pIn').value='';document.getElementById('dur').value='quarter';document.getElementById('typ').value='note';['cx','cy','cW','cH'].forEach(id=>document.getElementById(id).value='');return;}
  document.getElementById('sId').textContent=sel.id;
  document.getElementById('pIn').value=sel.pitch||'';
  document.getElementById('dur').value=sel.duration||'quarter';
  document.getElementById('typ').value=sel.type||'note';
  document.getElementById('cx').value=sel.x;document.getElementById('cy').value=sel.y;
  document.getElementById('cW').value=sel.width;document.getElementById('cH').value=sel.height;
  if(sel.pitch){
    const m=sel.pitch.match(/^([A-G])([#b]?)([0-9]?)$/);
    if(m){const[,st,ac,oc]=m;curBase=st;curAcc=ac;if(oc)document.getElementById('oct').value=oc;sAcc(ac,false);}
  }
}
function fc(f,v){if(sel){sel[f]=v;refSB();refSL();refJP();redraw();}}
function cc(f,v){if(sel){sel[f]=parseInt(v)||0;redraw();}}
function pManual(){if(sel){sel.pitch=document.getElementById('pIn').value.trim();refSB();refSL();refJP();redraw();}}
function sBase(p){curBase=p;uPitch();}
function sAcc(a,tr=true){
  curAcc=a;
  ['a0','a1','a2'].forEach((id,i)=>{const b=document.getElementById(id);b.className=i===(a===''?0:a==='#'?1:2)?'active':'';});
  if(tr)uPitch();
}
function uPitch(){
  if(!sel)return;
  const o=document.getElementById('oct').value;
  sel.pitch=curBase+curAcc+o;
  document.getElementById('pIn').value=sel.pitch;
  refSL();refJP();redraw();
}
function delSym(){if(!sel)return;syms=syms.filter(s=>s.id!==sel.id);sel=syms[0]||null;refAll();}

// Jianpu
function refJP(){clearTimeout(window._dt);window._dt=setTimeout(async()=>{
  const k=document.getElementById('jk').value,m=document.getElementById('jm').value;
  try{
    const r=await fetch(API+'/api/convert-to-jianpu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms,key:k,meter:m,title:'即時'})});
    const d=await r.json();
    if(r.ok&&d.jianpu_text)document.getElementById('jpArea').value=d.jianpu_text;
  }catch(e){}
},200);}
function cpyJp(){const t=document.getElementById('jpArea').value;if(!t){alert('無內容');return;}navigator.clipboard.writeText(t).then(()=>alert('已複製')).catch(e=>alert('失敗: '+e));}

// Symbol list
function refSL(){
  document.getElementById('sc').textContent=syms.length;
  const list=document.getElementById('sList');list.innerHTML='';
  const cols={note:'#06b6d4',rest:'#f97316',chord:'#a855f7',clef:'#64748b',barline:'#64748b'};
  syms.forEach(s=>{
    const d=document.createElement('div');
    d.className='si'+(sel&&sel.id===s.id?' sel':'');
    const dc=cols[s.type]||'#64748b';
    d.innerHTML='<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+dc+';margin-right:6px"></span><strong>'+s.id+'</strong> '+(s.pitch||s.type)+'</span><span style="color:var(--dim)">('+s.x+','+s.y+')</span>';
    d.onclick=()=>{sel=s;refAll();};
    list.appendChild(d);
  });
}

// Export
async function expXml(){
  if(!syms.length){alert('無符號');return;}
  showL('編譯 MusicXML...');
  try{
    const r=await fetch(API+'/api/export-musicxml',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms})});
    const d=await r.json();
    if(r.ok&&d.download_url){xmUrl=d.download_url;window.open(xmUrl,'_blank');}
    else alert('匯出失敗: '+(d.error||''));
  }catch(e){alert('錯誤: '+e);}finally{hideL();}
}
async function expJp(){
  if(!syms.length){alert('無符號');return;}
  showL('編譯簡譜...');
  const k=document.getElementById('jk').value,m=document.getElementById('jm').value;
  try{
    const r=await fetch(API+'/api/export-jianpu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms,key:k,meter:m,title:'Jianpu'})});
    const d=await r.json();
    if(r.ok&&d.download_url){jpUrl=d.download_url;window.open(jpUrl,'_blank');}
    else alert('失敗: '+(d.error||''));
  }catch(e){alert('錯誤: '+e);}finally{hideL();}
}
function dlXml(){if(xmUrl)window.open(xmUrl,'_blank');}
function dlJp(){
  if(jpUrl){window.open(jpUrl,'_blank');return;}
  const k=document.getElementById('jk').value,m=document.getElementById('jm').value;
  fetch(API+'/api/export-jianpu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:syms,key:k,meter:m,title:'Jianpu'})})
    .then(r=>r.json()).then(d=>{if(d.download_url)window.open(d.download_url,'_blank');else alert('失敗');});
}

// Project
async function saveProj(){
  const nm=document.getElementById('pName').value.trim()||'Untitled';
  let imgD='';try{const b=await new Promise(r=>cv.toBlob(r,'image/png'));imgD=await blob64(b);}catch(e){}
  showL('儲存專案...');
  try{
    const r=await fetch(API+'/api/project/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_name:nm,symbols:syms,settings:{key:document.getElementById('jk').value,meter:document.getElementById('jm').value},image_data:imgD})});
    const d=await r.json();
    if(d.status==='ok')showModal('儲存成功','專案已儲存。\n下載：'+(d.download_url||'請查伺服器目錄'));
    else alert('儲存失敗: '+(d.error||''));
  }catch(e){alert('錯誤: '+e);}finally{hideL();}
}
function blob64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function loadProj(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const resp=await fetch(API+'/api/project/load',{method:'POST',headers:{'Accept':'application/json'},body:f});
      const d=await resp.json();
      if(d.status==='ok'){
        syms=d.symbols||[];sel=syms[0]||null;
        document.getElementById('pName').value=d.project_name||'';
        if(d.settings){if(d.settings.key)document.getElementById('jk').value=d.settings.key;if(d.settings.meter)document.getElementById('jm').value=d.settings.meter;}
        if(d.image_url)setImg(d.image_url);
        else{cv.width=800;cv.height=600;}
        refAll();
      }else alert('載入失敗: '+(d.error||''));
    }catch(err){alert('錯誤: '+err);}
  };
  r.readAsText(f);e.target.value='';
}

// Tabs
function swTab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('act',['e','j','s','p'][i]===n));
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('act',['e','j','s','p'][i]===n));
}

// Modal
function showModal(t,m){
  document.getElementById('modalTitle').textContent=t||'提示';
  document.getElementById('modalMsg').textContent=m||'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
</script>
